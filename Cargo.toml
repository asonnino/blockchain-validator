[workspace]
resolver = "3"
members = [
  "crates/execution",
  "crates/checkpoint",
  "crates/validator",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
checkpoint = { path = "crates/checkpoint" }
execution = { path = "crates/execution" }

# Mysticeti crates are pinned to a single rev: same URL + same rev resolves to
# one source, so types like `CommittedSubDag` unify across `dag` and `replica`.
dag = { git = "https://github.com/asonnino/mysticeti", rev = "c5dbe28aa3d6f06ca807f757728f376c82c306c5" }
replica = { git = "https://github.com/asonnino/mysticeti", rev = "c5dbe28aa3d6f06ca807f757728f376c82c306c5" }
simulator = { git = "https://github.com/asonnino/mysticeti", rev = "c5dbe28aa3d6f06ca807f757728f376c82c306c5" }

[profile.release]
panic = "abort"
debug = 1

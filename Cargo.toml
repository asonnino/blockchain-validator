[workspace]
resolver = "3"
members = [
  "crates/execution",
  "crates/checkpoint",
  "crates/validator",
  "crates/cli",
]
default-members = ["crates/cli"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
checkpoint = { path = "crates/checkpoint" }
execution = { path = "crates/execution" }
validator = { path = "crates/validator" }

bincode = "1.3.3"
blake2 = "0.10.6"
clap = { version = "4.6", features = ["derive"] }
criterion = "0.8.2"
digest = "0.10.6"
eyre = "0.6.8"
futures = "0.3.28"
humantime-serde = "1.1"
prometheus = "0.14"
rand = "0.8.5"
serde = { version = "1.0.163", features = ["derive"] }
serde_yaml = "0.9.33"
tempfile = "3.6.0"
tokio = { version = "1.52.3", features = ["sync"] }
tracing = "0.1.37"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3.17", features = ["env-filter"] }

dag = { git = "https://github.com/asonnino/mysticeti", rev = "5a093a2223bda5cca1d15ee6bee97438782ab32e" }
orchestrator = { git = "https://github.com/asonnino/mysticeti", rev = "5a093a2223bda5cca1d15ee6bee97438782ab32e" }
replica = { git = "https://github.com/asonnino/mysticeti", rev = "5a093a2223bda5cca1d15ee6bee97438782ab32e" }
simulator = { git = "https://github.com/asonnino/mysticeti", rev = "5a093a2223bda5cca1d15ee6bee97438782ab32e" }

[profile.release]
panic = "abort"
debug = 1

[workspace]
resolver = "3"
members = [
  "crates/execution",
  "crates/fake-engine",
  "crates/move-engine",
  "crates/checkpoint",
  "crates/validator",
  "crates/cli",
  "crates/n-move",
]
default-members = ["crates/cli"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
checkpoint = { path = "crates/checkpoint" }
execution = { path = "crates/execution" }
fake-engine = { path = "crates/fake-engine" }
move-engine = { path = "crates/move-engine" }
validator = { path = "crates/validator" }

bincode = "1.3.3"
blake2 = "0.11.0"
clap = { version = "4.6", features = ["derive"] }
criterion = "0.8.2"
digest = "0.11.3"
eyre = "0.6.8"
futures = "0.3.28"
humantime-serde = "1.1"
prometheus = "0.14"
rand = "0.8.5"
serde = { version = "1.0.163", features = ["derive"] }
serde_yaml = "0.9.33"
tempfile = "3.6.0"
tokio = { version = "1.52.3", features = ["sync"] }
tracing = "0.1.37"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3.17", features = ["env-filter"] }

# Todo: bump past asonnino/mysticeti#328 (same-seed simulator nondeterminism) before reporting
# simulator numbers.
dag = { git = "https://github.com/asonnino/mysticeti", rev = "ce841202c7a69f7445e401676f7f32b2a025d7ca" }
orchestrator = { git = "https://github.com/asonnino/mysticeti", rev = "ce841202c7a69f7445e401676f7f32b2a025d7ca" }
replica = { git = "https://github.com/asonnino/mysticeti", rev = "ce841202c7a69f7445e401676f7f32b2a025d7ca" }
simulator = { git = "https://github.com/asonnino/mysticeti", rev = "ce841202c7a69f7445e401676f7f32b2a025d7ca" }

# Sui's latest execution cut for the Move engine.
# Todo: move to mainnet-v1.84.x once released; mainnet-v1.83.1 pins tokio =1.52.1, below the
# floor mysticeti requires.
bcs = "0.1.4"
move-binary-format = { git = "https://github.com/MystenLabs/sui", tag = "testnet-v1.84.0" }
move-core-types = { git = "https://github.com/MystenLabs/sui", tag = "testnet-v1.84.0" }
move-vm-runtime = { git = "https://github.com/MystenLabs/sui", tag = "testnet-v1.84.0" }
sui-adapter-latest = { git = "https://github.com/MystenLabs/sui", tag = "testnet-v1.84.0" }
sui-framework = { git = "https://github.com/MystenLabs/sui", tag = "testnet-v1.84.0" }
sui-move-natives-latest = { git = "https://github.com/MystenLabs/sui", tag = "testnet-v1.84.0" }
sui-protocol-config = { git = "https://github.com/MystenLabs/sui", tag = "testnet-v1.84.0" }
sui-types = { git = "https://github.com/MystenLabs/sui", tag = "testnet-v1.84.0" }
sui-verifier-latest = { git = "https://github.com/MystenLabs/sui", tag = "testnet-v1.84.0" }

[profile.release]
panic = "abort"
debug = 1
